user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Security: Hide Nginx Version
    server_tokens off;

    # Rate Limiting Zones (Token Bucket per IP)
    limit_req_zone $binary_remote_addr zone=api_ip_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Logging format without exposing sensitive URL query strings
    log_format op_secure_log '$remote_addr - $remote_user [$time_local] '
                             '"$request_method $uri" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" $request_time';

    access_log /var/log/nginx/access.log op_secure_log;
    error_log /var/log/nginx/error.log warn;

    include /etc/nginx/conf.d/*.conf;
}
