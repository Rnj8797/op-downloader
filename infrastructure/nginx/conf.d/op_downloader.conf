upstream fastapi_backend {
    server api:8000;
    keepalive 32;
}

# Redirect all plain HTTP traffic to HTTPS
server {
    listen 80;
    server_name api.opdownloader.app;
    return 301 https://$host$request_uri;
}

# Secure HTTPS Server
server {
    listen 443 ssl http2;
    server_name api.opdownloader.app;

    # SSL / TLS 1.3 Configuration
    ssl_certificate /etc/nginx/ssl/live/api.opdownloader.app/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/api.opdownloader.app/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;

    # Buffer & Size Hardening (Prevent buffer overflows & oversized payload DoS)
    client_max_body_size 32k;
    client_body_buffer_size 32k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 1k;

    # Apply Connection & Rate Limiting
    limit_conn conn_limit 10;
    limit_req zone=api_ip_limit burst=20 nodelay;

    location / {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
