name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'tests/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'tests/**'
      - '.github/workflows/backend.yml'

jobs:
  test:
    name: Backend Test Suite & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Master Verification Test Runner
        run: |
          python tests/run_all_tests.py

      - name: Verify Docker Container Build
        run: |
          docker build -t op-downloader-api:test -f backend/Dockerfile backend/
          docker build -t op-downloader-worker:test -f backend/Dockerfile.worker backend/
